# Demo host: Render Blueprint on the free tier (New > Blueprint, pick this repo).
# Free web services sleep after 15 min idle and take ~1 min to wake.
services:
  - type: web
    name: codesentinel
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MAX_DAILY_USD
        value: "3"
      - key: LIVE_RATE_PER_HOUR
        value: "40"
      - key: LIVE_MAX_CONCURRENT
        value: "3"
      - key: TRUSTED_PROXY_HOPS
        value: "1"

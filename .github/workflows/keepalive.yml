name: keepalive

# Pings the hosted demo so the Render free instance stays awake during judging.
# Set the repository variable DEMO_URL (Settings > Secrets and variables > Actions >
# Variables) to the demo's base URL. If it is unset, the job exits 0 without a request.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "${DEMO_URL}" ]; then
            echo "DEMO_URL is not set; nothing to ping."
            exit 0
          fi
          base="${DEMO_URL%/}"
          # /health is the service health route; / is the fallback.
          if curl -fsS --max-time 90 --retry 2 --retry-delay 10 -o /dev/null "${base}/health"; then
            echo "Pinged /health"
          elif curl -fsS --max-time 90 --retry 2 --retry-delay 10 -o /dev/null "${base}/"; then
            echo "Pinged /"
          else
            echo "Demo did not answer; it may be waking or redeploying."
          fi

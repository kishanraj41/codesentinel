name: web-image

# Builds Dockerfile.web and pushes it to GitHub Container Registry so Nebius
# Serverless AI (or any container host) can pull it. No API keys go into the image.
on:
  push:
    branches: [main, feat/live-fixes]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          python -m pip install -q -r requirements.txt -r web/requirements.txt pytest
          python -m pytest -q tests
          cd web && python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codesentinel-web" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CodeSentinel web demo
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name cs -p 8080:8080 ${{ steps.img.outputs.name }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/api/status
          curl -fsS -X POST localhost:8080/api/audit -H 'content-type: application/json' \
            -d '{"patient_id":"margaret-whitmore","mode":"cached"}' -o /dev/null
          docker rm -f cs
